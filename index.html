<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIHONGO POWER DRILL N2 — Kuis Interaktif</title>
<style>
  :root{
    --washi:#f7f3ea; --washi-deep:#efe7d6; --sumi:#252220; --sumi-soft:#5a534c;
    --vermilion:#bc4a3c; --vermilion-deep:#9c3a2f; --gold:#b6904a; --indigo:#33495c;
    --good:#3f7a5c; --bad:#bc4a3c; --line:#ddd3bd; --card:#fffdf8;
    --shadow: 0 1px 2px rgba(37,34,32,.06), 0 8px 24px rgba(37,34,32,.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family: "Hiragino Mincho ProN","Yu Mincho","Noto Serif JP", "Zen Old Mincho", serif;
    background: radial-gradient(1200px 600px at 85% -10%, #fbf6e9 0%, transparent 60%),
      radial-gradient(900px 500px at -10% 110%, #f3ead2 0%, transparent 55%), var(--washi);
    color:var(--sumi); min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  .stage{ max-width: 760px; margin: 0 auto; padding: 18px 16px 70px; }
  .sansfont{ font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:14px 18px; background: linear-gradient(160deg, var(--indigo) 0%, #233140 100%);
    border-radius:16px; box-shadow: var(--shadow); color:#f4ead0; margin-bottom:16px; }
  .topbar .brand{ font-size:15px; font-weight:600; letter-spacing:.02em; cursor:pointer; }
  .topbar .brand .sub{ display:block; font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif; font-size:10.5px; opacity:.75; font-weight:400; margin-top:2px; }
  .topbar-btn{ font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif; font-size:12px; font-weight:600;
    border:1px solid rgba(244,234,208,.3); background:rgba(244,234,208,.08); color:#f4ead0;
    border-radius:999px; padding:8px 14px; cursor:pointer; }
  .topbar-btn:hover{ background:rgba(244,234,208,.18); }
  .hidden{ display:none !important; }

  .selector-intro{ background:var(--card); border-radius:16px; box-shadow:var(--shadow); padding:20px 20px; margin-bottom:16px; text-align:center; }
  .selector-intro h1{ font-size:19px; margin:0 0 6px; color:var(--indigo); }
  .selector-intro p{ font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif; font-size:12.5px; color:var(--sumi-soft); margin:0; line-height:1.7; }

  .sel-section-title{ font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif; font-size:12.5px; font-weight:700;
    color:var(--sumi-soft); margin: 18px 4px 10px; letter-spacing:.03em; }

  .exam-grid{ display:flex; flex-direction:column; gap:12px; }
  .exam-card{ background:var(--card); border-radius:14px; box-shadow:var(--shadow); padding:16px 18px;
    cursor:pointer; transition:.15s; border:1.5px solid transparent; display:flex; align-items:center; gap:14px; }
  .exam-card:hover{ border-color:var(--gold); transform:translateY(-1px); }
  .exam-card:active{ transform:scale(.99); }
  .exam-card .badge{ font-size:24px; min-width:44px; text-align:center; flex:0 0 44px; }
  .exam-card .info{ flex:1; min-width:0; }
  .exam-card .info .title{ font-size:15.5px; color:var(--sumi); margin-bottom:2px; font-weight:600; }
  .exam-card .info .subtitle{ font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif; font-size:11.5px; color:var(--sumi-soft); margin-bottom:6px; }
  .exam-card .mini-progress-track{ width:100%; height:6px; background:var(--washi-deep); border-radius:99px; overflow:hidden; border:1px solid var(--line); }
  .exam-card .mini-progress-fill{ height:100%; background:linear-gradient(90deg,var(--vermilion),var(--gold)); border-radius:99px; width:0%; }
  .exam-card .mini-stat{ font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif; font-size:10.5px; color:var(--sumi-soft); margin-top:4px; }
  .exam-card .chevron{ font-size:18px; color:var(--sumi-soft); flex:0 0 auto; }
  .exam-card.disabled{ opacity:.5; cursor:default; }
  .exam-card.disabled:hover{ border-color:transparent; transform:none; }

  .mini-grid{ display:grid; grid-template-columns: repeat(6,1fr); gap:8px; }
  .mini-cell{ border:1.5px solid var(--line); background:var(--card); border-radius:10px; padding:10px 4px;
    font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif; font-size:12.5px; font-weight:600;
    color:var(--sumi-soft); cursor:pointer; text-align:center; transition:.15s; position:relative; }
  .mini-cell:hover{ border-color:var(--gold); }
  .mini-cell .dot{ position:absolute; top:4px; right:4px; width:7px;height:7px;border-radius:50%; }
  .mini-cell.done .dot{ background:var(--good); }
  .mini-cell.haswrong .dot{ background:var(--bad); }

  .cat-grid{ display:flex; flex-wrap:wrap; gap:8px; }
  .cat-cell{ border:1.5px solid var(--line); background:var(--card); border-radius:999px; padding:10px 16px;
    font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif; font-size:12.5px; font-weight:600;
    color:var(--sumi-soft); cursor:pointer; transition:.15s; }
  .cat-cell:hover{ border-color:var(--gold); }

  .progress-card{ background:var(--card); border-radius:14px; box-shadow:var(--shadow); padding:14px 18px; margin-bottom:14px; }
  .progress-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;
    font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif; font-size:12px; color:var(--sumi-soft); }
  .progress-top b{ color:var(--sumi); font-size:14px; }
  .progress-bar-track{ width:100%; height:9px; background:var(--washi-deep); border-radius:99px; overflow:hidden; border:1px solid var(--line); }
  .progress-bar-fill{ height:100%; background:linear-gradient(90deg,var(--vermilion),var(--gold)); border-radius:99px; width:0%; transition:width .3s ease; }
  .stat-row{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .stat-pill{ flex:1; min-width:70px; text-align:center; padding:7px 4px; border-radius:10px; background:var(--washi-deep);
    font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif; font-size:11px; color:var(--sumi-soft); border:1px solid var(--line); }
  .stat-pill b{ display:block; font-size:16px; color:var(--sumi); }
  .stat-pill.benar b{ color:var(--good); }
  .stat-pill.salah b{ color:var(--bad); }

  .toolbar{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .tb-btn{ flex:1; min-width:100px; border:1.5px solid var(--line); background:var(--card); border-radius:999px; padding:9px 8px;
    font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif; font-weight:600; font-size:12px; color:var(--sumi-soft); cursor:pointer; }
  .tb-btn:hover{ border-color:var(--gold); }

  .card{ background:var(--card); border-radius:16px; box-shadow:var(--shadow); padding:22px; margin-bottom:14px; }
  .qnum{ font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif; font-size:12px; color:var(--gold); font-weight:700; letter-spacing:.06em; margin-bottom:10px; }
  .qtext{ font-size: 22px; line-height: 1.7; margin: 0 0 6px; }
  .qtext u{ text-decoration-color: var(--vermilion); text-decoration-thickness:2px; text-underline-offset:3px; }
  ruby{ ruby-align:center; }
  rt{ font-size:0.55em; color:var(--sumi-soft); font-weight:500; user-select:none; }

  .options{ display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  .opt{ display:flex; align-items:flex-start; gap:12px; border:1.5px solid var(--line); border-radius:11px; padding: 13px 15px; cursor:pointer; background:#fffefb; transition: border-color .15s ease, background .15s ease; font-size:18px; line-height:1.6; }
  .opt:hover{ border-color: var(--gold); background: #fffaf0; }
  .opt .badge{ flex:0 0 auto; width:26px;height:26px; border-radius:50%; border:1.5px solid var(--sumi-soft); display:flex;align-items:center;justify-content:center; font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif; font-size:13px; font-weight:700; color:var(--sumi-soft); margin-top:1px; }
  .opt.selected{ border-color: var(--indigo); background: #eef3f6; }
  .opt.selected .badge{ background:var(--indigo); border-color:var(--indigo); color:#fff; }
  .opt.correct{ border-color: var(--good); background: #eef6f0; }
  .opt.correct .badge{ background:var(--good); border-color:var(--good); color:#fff; }
  .opt.incorrect{ border-color: var(--bad); background: #faeeec; }
  .opt.incorrect .badge{ background:var(--bad); border-color:var(--bad); color:#fff; }
  .opt.disabled{ cursor:default; }

  .feedback{ margin-top:16px; padding: 13px 15px; border-radius:10px; font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif; font-size:16px; line-height:2.0; display:none; }
  .feedback.show{ display:block; animation: rise .25s ease; }
  .feedback.ok{ background:#eef6f0; border:1px solid var(--good); color:#234a37; }
  .feedback.ng{ background:#faeeec; border:1px solid var(--bad); color:#6e2a21; }
  .feedback .tag{ font-weight:700; margin-right:6px; }
  .fb-id{ margin-top:10px; padding-top:10px; border-top:1px solid rgba(0,0,0,.08); font-style:italic; font-size:15px; color:inherit; opacity:.85; }
  .fb-qr{ margin-top:8px; padding:10px 12px; background:rgba(0,0,0,.03); border-radius:6px; font-size:16px; line-height:2.1; color:inherit; }
  .fb-alloptions{ margin-top:12px; padding-top:10px; border-top:1px solid rgba(0,0,0,.08); display:flex; flex-direction:column; gap:8px; }
  .fb-opt-row{ padding:8px 10px; border-radius:6px; font-size:15px; line-height:2.0; background:rgba(0,0,0,.03); border-left:3px solid rgba(0,0,0,.15); color:inherit; }
  .fb-opt-row.fb-opt-correct{ background:rgba(60,180,90,.10); border-left:3px solid rgba(60,180,90,.7); }
  .fb-opt-row.fb-opt-picked{ background:rgba(255,80,80,.10); border-left:3px solid rgba(255,80,80,.7); }

  @keyframes rise{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  .nav-row{ display:flex; gap:10px; margin-bottom:16px; }
  .nav-btn{ flex:1; border:1.5px solid var(--line); background:var(--card); border-radius:12px; padding:13px;
    font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif; font-weight:700; font-size:13.5px; color:var(--sumi); cursor:pointer; }
  .nav-btn.primary{ background:var(--vermilion); border-color:var(--vermilion); color:#fff7ec; }
  .nav-btn:disabled{ opacity:.4; cursor:default; }

  .grid-card{ background:var(--card); border-radius:14px; box-shadow:var(--shadow); padding:16px 18px; margin-bottom:14px; }
  .grid-card h3{ font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif; font-size:12.5px; color:var(--sumi-soft); margin:0 0 12px; font-weight:700; }
  .qgrid{ display:grid; grid-template-columns: repeat(10,1fr); gap:6px; max-height:260px; overflow-y:auto; }
  .qcell{ aspect-ratio:1; border-radius:8px; border:1.5px solid var(--line); background:var(--washi-deep);
    display:flex; align-items:center; justify-content:center; font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif;
    font-size:9.5px; color:var(--sumi-soft); cursor:pointer; }
  .qcell.cur{ border-color:var(--indigo); border-width:2px; }
  .qcell.correct{ background:var(--good); color:#fff; border-color:var(--good); }
  .qcell.wrong{ background:var(--bad); color:#fff; border-color:var(--bad); }
  .legend{ display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif; font-size:11px; color:var(--sumi-soft); }
  .legend .dot{ display:inline-block; width:9px;height:9px; border-radius:3px; margin-right:5px; vertical-align:middle; }
  .legend .d1{ background:var(--washi-deep); border:1px solid var(--line); }
  .legend .d2{ background:var(--good); }
  .legend .d3{ background:var(--bad); }

  @media (max-width:480px){
    .qtext{ font-size:19px; }
    .opt{ font-size:16px; }
    .qgrid{ grid-template-columns: repeat(7,1fr); }
    .mini-grid{ grid-template-columns: repeat(5,1fr); }
  }
</style>
</head>
<body>
<div class="stage">

  <div class="topbar">
    <div class="brand" id="brandHome">NIHONGO POWER DRILL N2<span class="sub">文字・語彙 ／ 課題 ＋ 集中トレーニング</span></div>
    <button type="button" class="topbar-btn hidden" id="btnChangeScope">← 選び直す</button>
  </div>

  <!-- ===== SCREEN 1: Selector ===== -->
  <div id="screenSelector">
    <div class="selector-intro">
      <h1>挑戦するセットを選んでください</h1>
      <p>好きなセットをタップすればすぐに始まります。進捗は自動的に保存され、間違えた問題はあとでまとめて復習できます。</p>
    </div>

    <div class="exam-grid" id="examGrid"></div>

    <div class="sel-section-title">📘 特定の課題（1〜30）を選ぶ</div>
    <div class="mini-grid" id="dayGrid"></div>

    <div class="sel-section-title">🎯 特定のカテゴリー（集中トレーニング）を選ぶ</div>
    <div class="cat-grid" id="catGrid"></div>
  </div>

  <!-- ===== SCREEN 2: Quiz ===== -->
  <div id="screenQuiz" class="hidden">
    <div class="progress-card">
      <div class="progress-top">
        <span id="scopeLabel" class="sansfont">課題</span>
        <b id="progressLabel">0 / 0</b>
      </div>
      <div class="progress-bar-track"><div class="progress-bar-fill" id="progressFill"></div></div>
      <div class="stat-row">
        <div class="stat-pill benar"><b id="statBenar">0</b>正解</div>
        <div class="stat-pill salah"><b id="statSalah">0</b>不正解</div>
        <div class="stat-pill"><b id="statBelum">0</b>未回答</div>
        <div class="stat-pill"><b id="statPersen">0%</b>正答率</div>
      </div>
    </div>

    <div class="toolbar">
      <button type="button" class="tb-btn" id="btnReset">↺ 最初からやり直す</button>
      <button type="button" class="tb-btn" id="btnReviewWrong">❌ 間違えた問題だけ復習</button>
    </div>

    <div class="card" id="card"></div>

    <div class="nav-row">
      <button type="button" class="nav-btn" id="prevBtn">← 前へ</button>
      <button type="button" class="nav-btn primary" id="nextBtn">次へ →</button>
    </div>

    <div class="grid-card">
      <h3>📋 問題番号一覧（タップで移動）</h3>
      <div class="qgrid" id="qgrid"></div>
      <div class="legend">
        <span><span class="dot d1"></span>未回答</span>
        <span><span class="dot d2"></span>正解</span>
        <span><span class="dot d3"></span>不正解</span>
      </div>
    </div>
  </div>

  <div class="footer sansfont" style="text-align:center;font-size:11px;color:var(--sumi-soft);margin-top:20px;">
    日本語能力試験 N2 文字・語彙 · 自習用（原著：日本語パワードリル N2 文字・語彙／アスク出版）
  </div>
</div>

<script>

let currentScope = null;
let FLAT = [];
let answers = [];
let answered = [];
let current = 0;

function lsKeyProgress(scopeId){ return 'n2_progress_' + scopeId; }
const LS_WRONG_KEY = 'n2quiz_wrong_v1';

function loadWrongSet(){
  try{
    const raw = localStorage.getItem(LS_WRONG_KEY);
    return raw ? new Set(JSON.parse(raw)) : new Set();
  }catch(e){ return new Set(); }
}
function saveWrongSet(set){
  try{ localStorage.setItem(LS_WRONG_KEY, JSON.stringify(Array.from(set))); }catch(e){}
}
function markWrong(uid){ if(!uid) return; const s=loadWrongSet(); s.add(uid); saveWrongSet(s); }
function markCorrectClear(uid){ if(!uid) return; const s=loadWrongSet(); if(s.has(uid)){ s.delete(uid); saveWrongSet(s); } }
function getWrongCount(){ return loadWrongSet().size; }

function loadScopeProgress(scopeId){
  try{
    const raw = localStorage.getItem(lsKeyProgress(scopeId));
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveScopeProgress(){
  if(!currentScope) return;
  try{
    localStorage.setItem(lsKeyProgress(currentScope.id), JSON.stringify({ answers, answered, current, ts: Date.now() }));
  }catch(e){}
}
function clearScopeProgress(scopeId){
  try{ localStorage.removeItem(lsKeyProgress(scopeId)); }catch(e){}
}

let _kadaiNumMap = null;
function getKadaiNumMap(){
  if(_kadaiNumMap) return _kadaiNumMap;
  _kadaiNumMap = {};
  let n = 1;
  KADAI_DATA.forEach(d => {
    d.groups.forEach(g => {
      g.items.forEach((it, ii) => {
        _kadaiNumMap['k-'+d.day+'-'+g.label+'-'+ii] = n++;
      });
    });
  });
  return _kadaiNumMap;
}
let _trainingNumMap = null;
function getTrainingNumMap(){
  if(_trainingNumMap) return _trainingNumMap;
  _trainingNumMap = {};
  let n = 1;
  TRAINING_DATA.forEach((c, idx) => {
    c.items.forEach((it, ii) => {
      _trainingNumMap['t-'+idx+'-'+ii] = n++;
    });
  });
  return _trainingNumMap;
}

function buildFlatKadai(daysFilter){
  const flat = [];
  const numMap = getKadaiNumMap();
  KADAI_DATA.forEach(d => {
    if(daysFilter && !daysFilter.includes(d.day)) return;
    d.groups.forEach(g => {
      g.items.forEach((it, ii) => {
        const uid = 'k-'+d.day+'-'+g.label+'-'+ii;
        flat.push({
          uid, num: numMap[uid],
          source:'kadai', day:d.day, groupLabel:g.label,
          q:it.q, opts:it.opts, ans:it.ans, exp:it.exp, id:it.id||'', qr:it.qr||'', optExp:it.optExp||null
        });
      });
    });
  });
  return flat;
}
function buildFlatTraining(catFilter){
  const flat = [];
  const numMap = getTrainingNumMap();
  TRAINING_DATA.forEach((c, idx) => {
    if(catFilter && !catFilter.includes(idx)) return;
    c.items.forEach((it, ii) => {
      const uid = 't-'+idx+'-'+ii;
      flat.push({
        uid, num: numMap[uid],
        source:'training', cat:c.cat,
        q:it.q, opts:it.opts, ans:it.ans, exp:it.exp, id:it.id||'', qr:it.qr||'', optExp:it.optExp||null
      });
    });
  });
  return flat;
}
function getAllPool(){ return buildFlatKadai(null).concat(buildFlatTraining(null)); }

function allScopeDefs(){
  const defs = [];
  defs.push({ id:'all', title:'全課題に挑戦', subtitle:'課題1〜30 まとめて（540問）', badge:'📘', build:()=>buildFlatKadai(null) });
  KADAI_DATA.forEach(d=>{
    defs.push({ id:'day-'+d.day, title:'課題 '+d.day, subtitle:null, badge:null, build:()=>buildFlatKadai([d.day]), isDay:true, dayNum:d.day });
  });
  defs.push({ id:'training-all', title:'集中トレーニングに挑戦', subtitle:'全カテゴリーまとめて（100問）', badge:'🎯', build:()=>buildFlatTraining(null) });
  TRAINING_DATA.forEach((c,idx)=>{
    defs.push({ id:'training-cat-'+idx, title:c.cat, subtitle:null, badge:null, build:()=>buildFlatTraining([idx]), isCat:true, catIdx:idx });
  });
  return defs;
}
function findScopeDef(id){
  return allScopeDefs().find(s=>s.id===id);
}

function scopeMiniStats(scopeId, flat){
  const prog = loadScopeProgress(scopeId);
  if(!prog || !prog.answered) return { answeredCount:0, total:flat.length, pct:0 };
  const answeredCount = prog.answered.filter(Boolean).length;
  const pct = flat.length>0 ? Math.round(answeredCount/flat.length*100) : 0;
  return { answeredCount, total:flat.length, pct };
}

function renderExamSelector(){
  const grid = document.getElementById('examGrid');
  grid.innerHTML = '';

  const mainDefs = [
    { id:'all', title:'全課題に挑戦', subtitle:'課題1〜30 まとめて（540問）', badge:'📘', build:()=>buildFlatKadai(null) },
    { id:'training-all', title:'集中トレーニングに挑戦', subtitle:'全カテゴリーまとめて（100問）', badge:'🎯', build:()=>buildFlatTraining(null) },
  ];
  mainDefs.forEach(def=>{
    const flat = def.build();
    const stats = scopeMiniStats(def.id, flat);
    const card = document.createElement('div');
    card.className = 'exam-card';
    card.innerHTML =
      '<div class="badge">'+def.badge+'</div>'+
      '<div class="info">'+
        '<div class="title">'+def.title+'</div>'+
        '<div class="subtitle">'+def.subtitle+'</div>'+
        '<div class="mini-progress-track"><div class="mini-progress-fill" style="width:'+stats.pct+'%"></div></div>'+
        '<div class="mini-stat">'+stats.answeredCount+' / '+stats.total+' 問回答済み</div>'+
      '</div>'+
      '<div class="chevron">›</div>';
    card.addEventListener('click', ()=> openScope(def.id));
    grid.appendChild(card);
  });

  const wrongCount = getWrongCount();
  const wcard = document.createElement('div');
  wcard.className = 'exam-card' + (wrongCount===0 ? ' disabled' : '');
  wcard.innerHTML =
    '<div class="badge">❌</div>'+
    '<div class="info">'+
      '<div class="title">間違えた問題を復習</div>'+
      '<div class="subtitle">これまでに間違えた問題だけをまとめて解く（'+wrongCount+'問）</div>'+
    '</div>'+
    '<div class="chevron">›</div>';
  if(wrongCount>0) wcard.addEventListener('click', ()=> openScope('wrong'));
  grid.appendChild(wcard);

  const dayGrid = document.getElementById('dayGrid');
  dayGrid.innerHTML = '';
  const wrongSet = loadWrongSet();
  KADAI_DATA.forEach(d=>{
    const flat = buildFlatKadai([d.day]);
    const prog = loadScopeProgress('day-'+d.day);
    const done = prog && prog.answered && prog.answered.every(Boolean) && prog.answered.length===flat.length;
    const hasWrong = flat.some(q=>wrongSet.has(q.uid));
    const cell = document.createElement('div');
    cell.className = 'mini-cell' + (done ? ' done' : '') + (hasWrong ? ' haswrong' : '');
    cell.textContent = d.day;
    if(done || hasWrong){
      const dot = document.createElement('div');
      dot.className = 'dot';
      cell.appendChild(dot);
    }
    cell.addEventListener('click', ()=> openScope('day-'+d.day));
    dayGrid.appendChild(cell);
  });

  const catGrid = document.getElementById('catGrid');
  catGrid.innerHTML = '';
  TRAINING_DATA.forEach((c, idx)=>{
    const cell = document.createElement('div');
    cell.className = 'cat-cell';
    cell.textContent = c.cat;
    cell.addEventListener('click', ()=> openScope('training-cat-'+idx));
    catGrid.appendChild(cell);
  });
}

function goToSelector(){
  saveScopeProgress();
  currentScope = null;
  document.getElementById('screenQuiz').classList.add('hidden');
  document.getElementById('screenSelector').classList.remove('hidden');
  document.getElementById('btnChangeScope').classList.add('hidden');
  renderExamSelector();
}

function openScope(scopeId){
  let flat, label;
  if(scopeId === 'wrong'){
    const wrongSet = loadWrongSet();
    if(wrongSet.size === 0){ alert('まだ間違えた問題がありません。'); return; }
    const pool = getAllPool();
    flat = pool.filter(q => wrongSet.has(q.uid));
    label = '❌ 間違えた問題を復習';
  } else {
    const def = findScopeDef(scopeId);
    if(!def){ alert('問題が見つかりませんでした。'); return; }
    flat = def.build();
    label = def.title;
  }
  if(flat.length === 0){ alert('問題が見つかりませんでした。'); return; }

  currentScope = { id: scopeId, label: label };
  FLAT = flat;

  const prog = (scopeId === 'wrong') ? null : loadScopeProgress(scopeId);
  if(prog && prog.answered && prog.answered.length === FLAT.length){
    answers = prog.answers;
    answered = prog.answered;
    current = Math.min(prog.current||0, FLAT.length-1);
  } else {
    answers = new Array(FLAT.length).fill(null);
    answered = new Array(FLAT.length).fill(false);
    current = 0;
  }

  document.getElementById('screenSelector').classList.add('hidden');
  document.getElementById('screenQuiz').classList.remove('hidden');
  document.getElementById('btnChangeScope').classList.remove('hidden');
  document.getElementById('scopeLabel').textContent = label;

  renderQuestion();
  renderGrid();
  updateProgressUI();
}

function computeStats(){
  let benar=0, salah=0;
  FLAT.forEach((q,i)=>{
    if(!answered[i]) return;
    if(answers[i]===q.ans) benar++; else salah++;
  });
  const belum = FLAT.length - benar - salah;
  const totalAnswered = benar+salah;
  const pct = totalAnswered>0 ? Math.round(benar/totalAnswered*100) : 0;
  return {benar, salah, belum, pct};
}

function updateProgressUI(){
  const s = computeStats();
  const answeredCount = s.benar + s.salah;
  document.getElementById('progressLabel').textContent = answeredCount + ' / ' + FLAT.length;
  document.getElementById('progressFill').style.width = (FLAT.length? (answeredCount/FLAT.length*100) : 0) + '%';
  document.getElementById('statBenar').textContent = s.benar;
  document.getElementById('statSalah').textContent = s.salah;
  document.getElementById('statBelum').textContent = s.belum;
  document.getElementById('statPersen').textContent = s.pct + '%';
}

function renderGrid(){
  const wrap = document.getElementById('qgrid');
  wrap.innerHTML = '';
  FLAT.forEach((q,i)=>{
    const cell = document.createElement('div');
    let cls = 'qcell';
    if(i===current) cls += ' cur';
    if(answered[i]){ cls += (answers[i]===q.ans) ? ' correct' : ' wrong'; }
    cell.className = cls;
    cell.textContent = q.num;
    cell.addEventListener('click', ()=>{ current = i; renderQuestion(); renderGrid(); saveScopeProgress(); });
    wrap.appendChild(cell);
  });
}

function renderQuestion(){
  const q = FLAT[current];
  let html = '';
  const totalForSource = q.source === 'training' ? 100 : 540;
  const sourceLabel = q.source === 'training' ? '集中トレーニング ' : '課題 ';
  html += '<div class="qnum">'+sourceLabel+'問題 '+q.num+' / '+totalForSource+'</div>';
  html += '<div class="qtext">'+q.q+'</div>';
  html += '<div class="options" id="optionsWrap">';
  q.opts.forEach((opt, i)=>{
    html += '<div class="opt" data-idx="'+i+'">'
      + '<div class="badge">'+(i+1)+'</div>'
      + '<div>'+opt+'</div></div>';
  });
  html += '</div>';
  html += '<div class="feedback" id="feedback"></div>';

  document.getElementById('card').innerHTML = html;
  document.querySelectorAll('#optionsWrap .opt').forEach(function(el){
    el.addEventListener('click', function(){
      selectOption(parseInt(el.dataset.idx));
    });
  });

  if(answered[current]){
    showFeedback(current, answers[current]);
  }

  document.getElementById('prevBtn').disabled = (current === 0);
  document.getElementById('nextBtn').textContent = (current === FLAT.length-1) ? '完了 ✓' : '次へ →';

  window.scrollTo({top:0, behavior:'instant'});
}

function selectOption(i){
  if(answered[current]) return;
  answers[current] = i;
  answered[current] = true;
  const q = FLAT[current];
  if(i === q.ans){ markCorrectClear(q.uid); }
  else { markWrong(q.uid); }
  showFeedback(current, i);
  updateProgressUI();
  renderGrid();
  saveScopeProgress();
}

function showFeedback(qIdx, selectedIdx){
  const q = FLAT[qIdx];
  const opts = document.querySelectorAll('#optionsWrap .opt');
  opts.forEach(o=>{
    const idx = parseInt(o.dataset.idx);
    o.classList.add('disabled');
    if(idx === q.ans) o.classList.add('correct');
    else if(idx === selectedIdx) o.classList.add('incorrect');
    if(idx === selectedIdx) o.classList.add('selected');
  });
  const fb = document.getElementById('feedback');
  const isCorrect = selectedIdx === q.ans;
  fb.className = 'feedback show ' + (isCorrect ? 'ok' : 'ng');
  let fbHtml = '<span class="tag">'+(isCorrect ? '✓ 正解！' : '✗ 不正解')+'</span>';
  fbHtml += '正解は「'+(q.ans+1)+'. '+q.opts[q.ans]+'」<br><br>';
  fbHtml += q.exp;
  if(q.id){
    fbHtml += '<div class="fb-id">🇮🇩 '+q.id+'</div>';
  }
  if(q.qr){
    fbHtml += '<div class="fb-qr">'+q.qr+'</div>';
  }
  if(q.optExp && q.optExp.length === q.opts.length){
    fbHtml += '<div class="fb-alloptions">';
    q.opts.forEach((optText, idx)=>{
      const isAns = idx === q.ans;
      const isPicked = idx === selectedIdx;
      let rowClass = 'fb-opt-row' + (isAns ? ' fb-opt-correct' : '') + (isPicked && !isAns ? ' fb-opt-picked' : '');
      let marker = isAns ? '✓' : (isPicked ? '✗' : '　');
      fbHtml += '<div class="'+rowClass+'"><b>'+marker+' '+(idx+1)+'. '+optText+'</b><br>'+q.optExp[idx]+'</div>';
    });
    fbHtml += '</div>';
  }
  fb.innerHTML = fbHtml;
}

function goPrev(){
  if(current === 0) return;
  current--;
  renderQuestion();
  renderGrid();
  saveScopeProgress();
}
function goNext(){
  if(current === FLAT.length-1){
    goToSelector();
    return;
  }
  current++;
  renderQuestion();
  renderGrid();
  saveScopeProgress();
}

function resetCurrentScope(){
  if(!currentScope) return;
  if(!confirm('この範囲の進捗をリセットしてもう一度最初から解きますか？')) return;
  answers = new Array(FLAT.length).fill(null);
  answered = new Array(FLAT.length).fill(false);
  current = 0;
  clearScopeProgress(currentScope.id);
  renderQuestion();
  renderGrid();
  updateProgressUI();
  saveScopeProgress();
}

function reviewWrongFromCurrent(){
  openScope('wrong');
}

document.addEventListener('DOMContentLoaded', function(){
  try{
    renderExamSelector();
  }catch(e){
    console.error('Init error:', e);
  }

  function on(id, handler){
    const el = document.getElementById(id);
    if(el) el.addEventListener('click', handler);
    else console.warn('Element not found for listener:', id);
  }
  on('brandHome', goToSelector);
  on('btnChangeScope', goToSelector);
  on('prevBtn', goPrev);
  on('nextBtn', goNext);
  on('btnReset', resetCurrentScope);
  on('btnReviewWrong', reviewWrongFromCurrent);
});
</script>
</body>
</html>
